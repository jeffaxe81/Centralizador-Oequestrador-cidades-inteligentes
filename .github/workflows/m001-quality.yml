name: M001 Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Bootstrap lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Quality gate
        run: pnpm quality

      - name: Docker build gate
        run: docker build -t axesistemas-integration-service:m001 .

      - name: Upload lockfile bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: m001-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
