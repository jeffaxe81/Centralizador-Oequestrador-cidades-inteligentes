name: M001 Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate

      - name: Require lockfile
        run: test -f pnpm-lock.yaml

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm quality

      - name: Docker build gate
        run: docker build -t axesistemas-integration-service:m001 .
