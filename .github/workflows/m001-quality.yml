name: M001 Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Bootstrap lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Quality gate
        run: pnpm quality

      - name: Docker build gate
        run: docker build -t axesistemas-integration-service:m001 .

      - name: Commit generated lockfile
        if: ${{ github.event_name == 'pull_request' && github.head_repo.full_name == github.repository }}
        run: |
          if git status --porcelain -- pnpm-lock.yaml | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: add reproducible pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "pnpm-lock.yaml already versioned"
          fi
