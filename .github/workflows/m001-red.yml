name: M001 RED Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  red-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test -- tests/app/health.test.ts
